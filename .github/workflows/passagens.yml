# Rasante. · a coleta das passagens roda aqui, na nuvem do GitHub, a cada 30 minutos (aos 7 e aos 37).
# São 4 máquinas ao mesmo tempo, cada uma com 1/4 dos destinos: lê o calendário de preços e confere
# o menor preço de cada destino na página do voo. Depois o passo "juntar" calcula o preço normal,
# grava o painel no Supabase e manda o e-mail dos alertas (no máximo às 8h, 13h e 19h).
# Se uma parte falhar, os destinos dela ficam com os preços da coleta anterior; se faltar quase tudo,
# o painel anterior é mantido e nenhum e-mail sai.
# Segredos (Settings → Secrets and variables → Actions): GMAIL_SENHA (senha de app do Gmail)
# e RASANTE_ROBO_TOKEN (memória e lista de clientes no Supabase). Cadastrados em 13/11/2026.
name: Passagens
on:
  schedule:
    - cron: "7,37 * * * *"   # a hora cheia é a mais disputada no GitHub
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/passagens.yml"]
permissions:
  contents: write
concurrency:
  group: passagens
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    env:
      TZ: America/Sao_Paulo
      RASANTE_ROBO_TOKEN: ${{ secrets.RASANTE_ROBO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Nodemailer (o robô carrega o módulo de e-mail, mesmo sem mandar)
        run: npm install --no-save --no-package-lock --no-audit --no-fund nodemailer@6.9.16
      - name: Chrome do robô
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Coleta da parte ${{ matrix.parte }} de 4
        run: xvfb-run --auto-servernum node passagens/robo/voar.mjs --parte ${{ matrix.parte }}/4
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: passagens/robo/parte-${{ matrix.parte }}.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Resumo
        if: always()
        run: |
          echo "## Parte ${{ matrix.parte }} de 4" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^\[[^]]*\] /- /' passagens/robo/robo.log >> "$GITHUB_STEP_SUMMARY" || true

  juntar:
    needs: coleta
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      GMAIL_SENHA: ${{ secrets.GMAIL_SENHA }}
      RASANTE_ROBO_TOKEN: ${{ secrets.RASANTE_ROBO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Nodemailer (envio do e-mail no padrão que o Gmail confere)
        run: npm install --no-save --no-package-lock --no-audit --no-fund nodemailer@6.9.16
      - uses: actions/download-artifact@v4
        with:
          path: partes
      - name: Junta as partes, grava o painel e manda os alertas
        run: node passagens/robo/voar.mjs --juntar partes
      - name: Resumo
        if: always()
        run: |
          echo "## Passagens saindo de Goiânia" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^\[[^]]*\] /- /' passagens/robo/robo.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guarda o registro quando a coleta falha (para ver o erro sem login)
        if: failure()
        run: |
          git config user.name "Rasante robô"
          git config user.email "robo@confere.invalid"
          cp passagens/robo/robo.log passagens/robo/erro.log 2>/dev/null || echo "sem registro" > passagens/robo/erro.log
          git add passagens/robo/erro.log
          git commit -m "Passagens: registro da coleta que falhou" -- passagens/robo/erro.log || exit 0
          git pull --rebase --autostash && git push
